[project]
name = "outreach-scout"
version = "0.1.0"
description = "Outbound Research Agent (AI SDR) — tool-using agent with job queue and human approval gate"
requires-python = ">=3.11"
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "google-auth>=2.35",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    # queue / cache
    "redis>=5.2",
    "arq>=0.26",
    # agent / llm — OpenAI-compatible (Groq/Gemini/OpenRouter/Ollama) by default,
    # Anthropic optional.
    "openai>=1.97",
    "anthropic>=0.40",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langfuse>=2.53",
    # tools / http
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "ddgs>=9.0",
    # misc
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
